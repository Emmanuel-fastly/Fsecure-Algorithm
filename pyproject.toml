[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fsecure-algorithm"
version = "2.0.0"
description = "Educational AES-based block cipher with a key-dependent column permutation, plus CTR + HMAC authenticated encryption."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Development Status :: 3 - Alpha",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
fsecure = "fsecure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
